name: Supabase health check

on:
  schedule:
    # 08:23, 16:23, and 00:23 Singapore time. Off-hour minutes reduce GitHub scheduler delays.
    - cron: '23 0,8,16 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-healthcheck
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Run read-only database health check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          : "${SUPABASE_URL:?Add SUPABASE_URL to the repository Actions secrets}"
          : "${SUPABASE_PUBLISHABLE_KEY:?Add SUPABASE_PUBLISHABLE_KEY to the repository Actions secrets}"

          project_url="${SUPABASE_URL%/}"
          project_url="${project_url%/rest/v1}"

          result="$(curl --fail-with-body --silent --show-error \
            --retry 3 --retry-all-errors \
            --request POST \
            --header "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            --header "Content-Type: application/json" \
            --data '{}' \
            "${project_url}/rest/v1/rpc/project_healthcheck")"

          if [[ "${result}" != "true" ]]; then
            echo "Unexpected health-check response: ${result}"
            exit 1
          fi

          echo "Supabase database health check passed."
